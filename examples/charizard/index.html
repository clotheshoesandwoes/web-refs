<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charizard, Base Set, 1999</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  :root {
    --bg: #12110f;
    --ink: #ebe7df;
    --soft: #9d978c;
    --rule: #2b2925;
    --case: #1c1b19;
    --label: #e9e5dc;
    --label-ink: #1a1917;
  }
  html { background: var(--bg); }
  body {
    min-height: 100svh;
    color: var(--ink);
    font: 400 16px/1.55 "Libre Franklin", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 6vh 24px;
  }

  /* The case and its label sit side by side, the way a museum hangs an object. */
  .piece {
    display: grid;
    grid-template-columns: auto minmax(0, 300px);
    align-items: end;
    gap: 56px;
  }

  .turn { display: grid; justify-items: start; gap: 18px; }
  .slab {
    all: unset;
    cursor: pointer;
    display: block;
    width: min(360px, 78vw);
    aspect-ratio: 3.15 / 5.3;
    perspective: 1600px;
  }
  .slab:focus-visible { outline: 1px solid var(--soft); outline-offset: 8px; }
  .faces {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.3, 0.1, 0.2, 1);
  }
  .slab[aria-pressed="true"] .faces { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    background: var(--case);
    border: 1px solid #3a3833;
  }
  .face.back { transform: rotateY(180deg); }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face img[hidden] { display: none; }

  /* Stand-in drawn until front.jpg and back.jpg sit beside this file. */
  .stand-in { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 12px; }
  .stand-in .tag {
    background: var(--label);
    color: var(--label-ink);
    border-radius: 3px;
    padding: 9px 11px;
    font-size: 11.5px;
    line-height: 1.35;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .stand-in .tag b { font-weight: 600; }
  .stand-in .window {
    border-radius: 6px;
    background: #24221f;
    display: grid;
    place-items: center;
    color: #6d685f;
    font-size: 13px;
  }
  .has-photo .stand-in { display: none; }

  .flip {
    all: unset;
    cursor: pointer;
    color: var(--soft);
    font-size: 14px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
  }
  .flip:hover, .flip:focus-visible { color: var(--ink); border-color: var(--soft); }

  .label { max-width: 34ch; padding-bottom: 46px; }
  .label h1 { font-size: 22px; line-height: 1.25; font-weight: 600; margin-bottom: 6px; }
  .label p + p { margin-top: 14px; }
  .label .quiet { color: var(--soft); font-size: 14px; }
  .label a { color: inherit; text-decoration-color: var(--soft); text-underline-offset: 3px; }
  .label a:hover { text-decoration-color: var(--ink); }

  @media (max-width: 760px) {
    body { place-items: start center; }
    .piece { grid-template-columns: 1fr; gap: 28px; }
    .turn { justify-items: center; }
    .label { padding-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .faces { transition: none; }
  }
</style>
</head>
<body>
<main class="piece">
  <div class="turn">
    <button class="slab" id="slab" aria-pressed="false" aria-label="Charizard in its case. Turn over">
      <span class="faces">
        <span class="face front">
          <img src="front.jpg" alt="" hidden>
          <span class="stand-in">
            <span class="tag"><span>1999 Pokémon Base Set<br><b>Charizard</b> Holo, Shadowless</span><span>#4<br><b>Mint 9</b></span></span>
            <span class="window">front.jpg</span>
          </span>
        </span>
        <span class="face back">
          <img src="back.jpg" alt="" hidden>
          <span class="stand-in">
            <span class="tag"><span>Certificate</span><span>12345678</span></span>
            <span class="window">back.jpg</span>
          </span>
        </span>
      </span>
    </button>
    <button class="flip" id="flip" type="button">Turn over</button>
  </div>

  <section class="label">
    <h1>Charizard</h1>
    <p>Pokémon Trading Card Game, Base Set, 1999. Card 4 of 102, holographic, from the shadowless first print.</p>
    <p>Graded Mint 9 by PSA, <a id="cert" href="https://www.psacard.com/cert/12345678">certificate 12345678</a>.</p>
    <p>“Pulled it myself in 1999. A small piece of childhood, kept behind clear acrylic.”</p>
    <p class="quiet">Collection of the owner. Not for sale.</p>
  </section>
</main>

<script>
  const slab = document.getElementById('slab');
  const flip = document.getElementById('flip');

  function turn() {
    const back = slab.getAttribute('aria-pressed') !== 'true';
    slab.setAttribute('aria-pressed', back);
    flip.textContent = back ? 'Turn back' : 'Turn over';
  }
  slab.addEventListener('click', turn);
  flip.addEventListener('click', turn);

  // Use the photos when they are there; keep the stand-in when they are not.
  for (const img of slab.querySelectorAll('img')) {
    const probe = new Image();
    probe.onload = () => { img.hidden = false; img.closest('.face').classList.add('has-photo'); };
    probe.src = img.getAttribute('src');
  }
</script>
</body>
</html>
