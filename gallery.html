<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-refs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  :root {
    --bg: #121211;
    --panel: #181816;
    --ink: #ece8e1;
    --soft: #9b968d;
    --faint: #5f5b55;
    --rule: #2a2926;
    --mark: #d2402a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); display: grid; grid-template-columns: 260px 1fr; overflow: hidden; }
  a { color: inherit; }

  nav { border-right: 1px solid var(--rule); overflow-y: auto; padding: 22px 0 40px; background: var(--panel); }
  nav h1 { font: 600 20px/1.2 var(--serif); padding: 0 22px 18px; }
  nav h2 { font: 400 13px/1.4 var(--sans); color: var(--faint); padding: 18px 22px 6px; }
  nav button { all: unset; display: block; width: 100%; padding: 5px 22px; cursor: pointer; color: var(--soft); font: 400 15px/1.35 var(--serif); }
  nav button:hover { color: var(--ink); }
  nav button[aria-current="true"] { color: var(--ink); box-shadow: inset 2px 0 0 var(--mark); }
  nav button:focus-visible { outline: 1px solid var(--soft); outline-offset: -1px; }

  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  header { display: flex; align-items: baseline; gap: 18px; padding: 20px 28px 14px; border-bottom: 1px solid var(--rule); }
  header h2 { font: 600 28px/1.1 var(--serif); white-space: nowrap; }
  header p { color: var(--soft); font: 400 16px/1.4 var(--serif); flex: 1; }
  header .links { display: flex; gap: 16px; white-space: nowrap; font-size: 13px; }
  header .links a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--rule); }
  header .links a:hover { color: var(--ink); border-color: var(--mark); }

  .stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 18px 28px; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; border: 1px solid var(--rule); background: #000; cursor: zoom-in; }
  .stage img.phone { height: 100%; }
  .stage .count { position: absolute; right: 30px; bottom: 6px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

  footer { border-top: 1px solid var(--rule); padding: 12px 28px 16px; display: grid; gap: 10px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .strip button { all: unset; cursor: pointer; flex: none; border: 1px solid var(--rule); opacity: 0.55; line-height: 0; }
  .strip button[aria-current="true"] { opacity: 1; border-color: var(--soft); }
  .strip button:hover { opacity: 1; }
  .strip img { height: 64px; width: auto; display: block; }
  .meta { color: var(--faint); font-size: 12px; display: flex; gap: 22px; flex-wrap: wrap; }
  .meta b { color: var(--soft); font-weight: 400; }
  .keys { color: var(--faint); font-size: 12px; }

  .zoom { position: fixed; inset: 0; background: rgba(8, 8, 8, 0.96); display: none; overflow: auto; cursor: zoom-out; z-index: 5; }
  .zoom.open { display: block; }
  .zoom img { display: block; margin: 0 auto; max-width: none; width: min(100%, 1440px); }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { display: none; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<nav id="nav" aria-label="Sites"><h1>web-refs</h1></nav>
<main>
  <header>
    <h2 id="name"></h2>
    <p id="idea"></p>
    <div class="links"><a id="teardown" href="#">Teardown</a><a id="live" href="#" target="_blank" rel="noopener">Live site</a></div>
  </header>
  <div class="stage"><img id="shot" alt=""><span class="count" id="count"></span></div>
  <footer>
    <div class="strip" id="strip"></div>
    <div class="meta" id="meta"></div>
    <div class="keys">Left and right: screens. Up and down: sites. M: motion. Enter: full size. T: teardown.</div>
  </footer>
</main>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>

<script src="gallery.data.js"></script>
<script>
(function () {
  var sites = window.SITES || [];
  var $ = function (id) { return document.getElementById(id); };
  var si = 0, hi = 0, items = [];

  // Rail, grouped.
  var nav = $('nav'), group = null;
  sites.forEach(function (s, i) {
    if (s.group !== group) {
      group = s.group;
      var h = document.createElement('h2');
      h.textContent = s.groupTitle;
      nav.appendChild(h);
    }
    var b = document.createElement('button');
    b.textContent = s.name;
    b.onclick = function () { show(i, 0); };
    s.button = b;
    nav.appendChild(b);
  });

  function show(i, j) {
    si = (i + sites.length) % sites.length;
    var s = sites[si];
    items = s.shots.slice();
    if (s.motion) items.splice(1, 0, 'motion.webp');
    hi = (j + items.length) % items.length;
    sites.forEach(function (x) { x.button.setAttribute('aria-current', x === s); });
    s.button.scrollIntoView({ block: 'nearest' });
    $('name').textContent = s.name;
    $('idea').textContent = s.idea;
    $('teardown').href = 'sites/' + s.slug + '/teardown.md';
    $('live').href = s.url;
    var st = s.stack || {}, w = st.weightKB || {};
    $('meta').innerHTML = '';
    [['Built with', (st.libs || []).join(', ') || 'nothing detected'], ['Type', (st.fonts || []).join(', ')], ['Weight', w.total ? w.total + ' KB' : '']]
      .forEach(function (r) { if (r[1]) { var e = document.createElement('span'); e.innerHTML = '<b>' + r[0] + '</b> '; e.appendChild(document.createTextNode(r[1])); $('meta').appendChild(e); } });
    var strip = $('strip');
    strip.innerHTML = '';
    items.forEach(function (f, k) {
      var b = document.createElement('button');
      var img = document.createElement('img');
      img.src = 'sites/' + s.slug + '/' + (f === 'motion.webp' ? 'card.jpg' : 't/' + f);
      img.alt = f;
      img.loading = 'lazy';
      b.appendChild(img);
      b.title = f === 'motion.webp' ? 'motion' : f;
      b.onclick = function () { pick(k); };
      strip.appendChild(b);
    });
    pick(hi);
    try { localStorage.setItem('web-refs', si + ',' + hi); } catch (e) {}
  }

  function pick(k) {
    hi = (k + items.length) % items.length;
    var f = items[hi], s = sites[si];
    var img = $('shot');
    img.src = 'sites/' + s.slug + '/' + f;
    img.alt = s.name + ', ' + f;
    img.className = f === 'phone.jpg' ? 'phone' : '';
    $('count').textContent = (hi + 1) + ' / ' + items.length;
    [].forEach.call($('strip').children, function (b, n) { b.setAttribute('aria-current', n === hi); if (n === hi) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
    try { localStorage.setItem('web-refs', si + ',' + hi); } catch (e) {}
  }

  $('shot').onclick = function () { $('zoomImg').src = this.src; $('zoom').classList.add('open'); };
  $('zoom').onclick = function () { this.classList.remove('open'); };

  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') return $('zoom').classList.remove('open');
    if (e.key === 'ArrowRight') pick(hi + 1);
    else if (e.key === 'ArrowLeft') pick(hi - 1);
    else if (e.key === 'ArrowDown') show(si + 1, 0);
    else if (e.key === 'ArrowUp') show(si - 1, 0);
    else if (e.key === 'm' || e.key === 'M') { var m = items.indexOf('motion.webp'); if (m >= 0) pick(m); }
    else if (e.key === 'Enter') $('shot').click();
    else if (e.key === 't' || e.key === 'T') location.href = $('teardown').href;
    else return;
    e.preventDefault();
  });

  var saved = [0, 0];
  try { saved = (localStorage.getItem('web-refs') || '0,0').split(',').map(Number); } catch (e) {}
  if (sites.length) show(saved[0] || 0, saved[1] || 0);
})();
</script>
</body>
</html>
